name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/fretboard exec playwright install --with-deps chromium
      - run: pnpm --dir apps/fretboard exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-fretboard
          path: apps/fretboard/playwright-report/
          retention-days: 30

  e2e-flashcards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      # The tests start from empty storage and import the decks the dev server
      # serves, so they have to exist first.
      - run: pnpm generate:decks
      - run: pnpm --dir apps/flashcards exec playwright install --with-deps chromium
      - run: pnpm --dir apps/flashcards exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-flashcards
          path: apps/flashcards/playwright-report/
          retention-days: 30
